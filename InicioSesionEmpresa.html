<!DOCTYPE html>
<html>
<head>
    <title>PROYECTO</title>
    <meta charset="UTF-8">
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" lang="es"></meta>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link type="text/css" rel="stylesheet" href="./CSS/InicioSesionEmpresa.css">
</head>

<body class="p-0 m-0 bg-dark">
    <video autoplay loop muted id="video_background">
        <source src="./IMAGENES/0_Landscape_Mountains_1280x720.mp4" type="video/mp4">
    </video>
    <main class="p-0 m-0">
            <nav class="container-fluid">
                <button class="atras"><span></span></button>
                <div class="logo"></div>
            </nav>
            <!-- Botones principales -->
            <div class="container-fluid general-reg p-0 m-0 ">
                <div class="botones-reg" id="botonesPrinc">
                    <button class="btn" id="botonInicio">Iniciar Sesión</button>
                    <button class="btn" id="botonRegistro">Registrarse</button>
                </div> 
                <!-- Formulario de Inicio de Sesión -->
                 <div id="Elogin" class=" oculto mb-5 formu ">
                    <form>
                        <button type="button" class="atras" onclick="volver()"><span class="bi bi-arrow-left"></span></button>
                        <h3 align="center" class="text-white">INICIO SESIÓN</h3>
                        <div>
                            <label for="correo" class="form-label text-white"></label>
                            <input type="text" class="form-control correo bi bi-person-fill" id="Correo" name="correo" placeholder="Correo" required>
                            <span class="bi bi-person-fill text-white persona"></span>
                        </div>
                        <div>
                            <label for="contrasena" class="form-label text-white"></label>
                            <input type="password" class="form-control contra" id="Contraseña" name="contrasena" placeholder="Contraseña" required>
                            <span class="bi bi-lock-fill text-white candado"></span>
                        </div>
                        <button type="submit" class="btn mt-3">Iniciar Sesión</button>
                    </form>
                </div>

                <!-- Formulario de Registro -->
                 <div id="Eregistro" class=" oculto formu mb-5">
                    <form>
                        <button type="button" class="atras" onclick="volver()"><span class="bi bi-arrow-left"></span></button>
                        <h3 align="center" class="text-white">REGISTRO</h3>
                        <div>
                            <label for="nombre" class="form-label text-white"></label>
                            <input type="text" class="form-control correo" id="ENombre" name="nombre" placeholder="Nombre completo" required>
                        </div>
                        <div>
                            <label for="corre" class="form-label text-white"></label>
                            <input type="correo" class="form-control" id="ECorreoRegistro" name="correoRegistro" placeholder="Email" required>
                        </div>
                        <div id="telef" class="mt-3">
                            <select class="from-select rounded me-2" name="" id="">
                                <option value="+34" selected>🇪🇸 +34</option>
                                <option value="+33">🇫🇷 +33</option>
                                <option value="+39">🇮🇹 +39</option>
                                <option value="+44">🇬🇧 +44</option>
                                <option value="+49">🇩🇪 +49</option>
                            </select>
                            <input type="number" class="form-control" id="ETelefono" name="ETelefono" placeholder="Teléfono" pattern="[0-9]{9}" required>
                        </div>
                        <button type="submit" class="btn mt-3">Registrarse</button>
                    </form>
                </div>
                 
            </div>
        
    </main>

</body>
<script>
     const FormIniciar = document.getElementById("Elogin");
        const FormRegistrar = document.getElementById("Eregistro");
        const botonesPrinc = document.getElementById("botonesPrinc");
        

        document.getElementById("botonInicio").addEventListener("click", () => {
            botonesPrinc.classList.add("oculto");
            FormIniciar.classList.remove("oculto");
            FormIniciar.classList.add("animacion");
        });

        document.getElementById("botonRegistro").addEventListener("click", () => {
            botonesPrinc.classList.add("oculto");
            FormRegistrar.classList.remove("oculto");
            FormRegistrar.classList.add("animacion");
        });

        
        function volver() {
            FormIniciar.classList.add("oculto");
            FormRegistrar.classList.add("oculto");
            botonesPrinc.classList.remove("oculto");
        }
</script>
</html>
